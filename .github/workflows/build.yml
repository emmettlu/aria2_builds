name: Build rufus

on:
  push:
  workflow_dispatch:

jobs:
  build:
    env:
      PROJECT_REPOSITORY: ProjectMile/Mile.Aria2
      PROJECT_VERSION: 1.0.1050.0
      PROJECT_PATH: Aria2
      PROJECT_BIN: Aria2
    strategy:
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: switch ${{ env.PROJECT_PATH }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PROJECT_REPOSITORY }}
          ref: refs/tags/${{ env.PROJECT_VERSION }}
          path: ${{ env.PROJECT_PATH }}
          submodules: 'recursive'

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: clear NuGet cache
        run: dotnet nuget locals all --clear

      - name: build
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          msbuild BuildAllTargets.proj `
          /p:PlatformToolset=v142 `
          /p:WindowsTargetPlatformVersion=10.0.19041.0 `
          /p:Platform=x64 `
          /p:Configuration=Release `
          /p:WholeProgramOptimization=true `
          /p:Optimization=MinSpace `
          /p:FunctionLevelLinking=true `
          /v:minimal

      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PROJECT_BIN }}_${{ runner.os }}
          path: |
            ${{ env.PROJECT_PATH }}/x64/Release/*.dll
            ${{ env.PROJECT_PATH }}/x64/Release/${{ env.PROJECT_BIN }}.exe
